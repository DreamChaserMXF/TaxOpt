services:
  taxopt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 证书目录（certbot 自动续期，挂载只读）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - taxopt
